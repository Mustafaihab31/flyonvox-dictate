[package]
name = "flyonvox-dictate"
version = "1.0.0"
description = "Privacy-first local dictation for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[profile.release]
strip = true
